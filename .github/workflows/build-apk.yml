name: Build Ionic Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Ionic Vue application
        run: npm run build

      # Capacitor 8 compiles its Android code at source/target level 21,
      # so anything older fails with "invalid source release: 21".
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check Java environment
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # compileSdk is 36 (see android/variables.gradle), so pin that platform
      # explicitly rather than relying on what the runner image ships with.
      - name: Check Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename the generated APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk IonicPhotoGallery.apk

      - name: Upload Ionic Photo Gallery APK
        uses: actions/upload-artifact@v4
        with:
          name: IonicPhotoGallery-APK
          path: IonicPhotoGallery.apk
          if-no-files-found: error
          retention-days: 30
